<body>
    <input id="nhapngaythang" type="datetime" placeholder="hay nhap ngay thang nam">
    <span class="error" id="spandatetime"></span>
    <button id="btncheck">Check</button>
    <p id="datetime"></p>
    <script>
        var date = document.getElementById("nhapngaythang").value;
        var spandate = document.getElementById("spandatetime");
        function checkdatetime() {
            console.log("click")
            var pattern = /^(\d{2})\/(\d{2})\/(\d{4})/;
            var logic = pattern.test(date.value);
            if (logic) {
                pattern.innerText = "OK";
            } else {
                pattern.innerText = "error";
                
            }
            
        }
        
    </script>
